      var cta = document.getElementById("close07-cta");

      var tl = gsap.timeline({ paused: true });

      // Camera modifier — barely-perceptible continuous drift under the hold,
      // so a fully static end-card doesn't read as a freeze-frame.
      tl.fromTo(bgWorld, { scale: 1 }, { scale: 1.035, duration: 4, ease: "none" }, 0);

      // Scene 1 (0.0-1.5s) — headline blur-snaps into focus. Opacity resolves

      // longer so the "snap into focus" read lands cleanly inside Scene 1.
      tl.fromTo(headline, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.15);
      tl.fromTo(
        headline,
        { "--dof": "18px" },
        { "--dof": "0px", duration: 0.9, ease: "power2.out" },
        0.15
      );

      // Scene 2 (1.5-4.0s) — CTA line settles beneath on a soft crossfade-up,
      // then the whole card holds fully still to the final frame (no exit —
      // this is the last frame of the video).
      tl.fromTo(
        cta,
        { opacity: 0, yPercent: 42 },
        { opacity: 1, yPercent: 0, duration: 0.7, ease: "power2.out" },
        1.6
      );

      window.__timelines["07-close"] = tl;
    })();
