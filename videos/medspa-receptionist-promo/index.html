<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-stat"
        class="scene"
        data-composition-id="01-stat"
        data-composition-src="compositions/frames/01-stat.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-cost"
        class="scene"
        data-composition-id="02-cost"
        data-composition-src="compositions/frames/02-cost.html"
        data-start="4"
        data-duration="5.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-turn"
        class="scene"
        data-composition-id="03-turn"
        data-composition-src="compositions/frames/03-turn.html"
        data-start="9"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-whatsapp"
        class="scene"
        data-composition-id="04-whatsapp"
        data-composition-src="compositions/frames/04-whatsapp.html"
        data-start="13"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-call"
        class="scene"
        data-composition-id="05-call"
        data-composition-src="compositions/frames/05-call.html"
        data-start="19"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-benefit"
        class="scene"
        data-composition-id="06-benefit"
        data-composition-src="compositions/frames/06-benefit.html"
        data-start="25"
        data-duration="4.4"
        data-track-index="1"
      ></div>

      <div
        id="el-07-close"
        class="scene"
        data-composition-id="07-close"
        data-composition-src="compositions/frames/07-close.html"
        data-start="29"
        data-duration="4"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-stat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-cost", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-cost", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 9);
        tl.fromTo("#el-03-turn", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 9);
        tl.to("#el-03-turn", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-04-whatsapp", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-04-whatsapp", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-05-call", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to("#el-05-call", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-06-benefit", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to("#el-06-benefit", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 29);
        tl.fromTo("#el-07-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 29);
        tl.to({}, { duration: 33 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
